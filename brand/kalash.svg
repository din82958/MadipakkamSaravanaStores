<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" fill="none" role="img" aria-label="Auspicious brass kalash with mango leaves and coconut">
  <defs>
    <linearGradient id="kbrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b978"/>
      <stop offset=".5" stop-color="#b0863a"/>
      <stop offset="1" stop-color="#8a6626"/>
    </linearGradient>
    <linearGradient id="kleaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8f52"/>
      <stop offset="1" stop-color="#1f6035"/>
    </linearGradient>
    <radialGradient id="knut" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#8a6626"/>
      <stop offset="1" stop-color="#5e401a"/>
    </radialGradient>
  </defs>
  <!-- mango leaves -->
  <g fill="url(#kleaf)">
    <path d="M110 66C86 60 66 66 54 86c22 8 40 4 56-12Z"/>
    <path d="M110 66c24-6 44 0 56 20-22 8-40 4-56-12Z"/>
    <path d="M110 62c-14-10-30-10-44 2 16 10 32 8 44-6Z" opacity=".9"/>
    <path d="M110 62c14-10 30-10 44 2-16 10-32 8-44-6Z" opacity=".9"/>
  </g>
  <!-- coconut -->
  <ellipse cx="110" cy="44" rx="22" ry="26" fill="url(#knut)"/>
  <path d="M110 20c6 8 6 16 0 24-6-8-6-16 0-24Z" fill="#6f4d1f"/>
  <!-- pot body -->
  <g stroke="url(#kbrass)" stroke-width="3.6" stroke-linejoin="round">
    <path d="M70 96h80c8 0 12 5 10 12l-8 34c14 10 22 26 22 44 0 34-30 58-64 58S46 220 46 186c0-18 8-34 22-44l-8-34c-2-7 2-12 10-12Z" fill="url(#kbrass)" stroke="none"/>
  </g>
  <!-- decorative bands -->
  <path d="M64 150q46 20 92 0" stroke="#5e401a" stroke-width="3" opacity=".5" fill="none"/>
  <path d="M60 176q50 24 100 0" stroke="#5e401a" stroke-width="3" opacity=".5" fill="none"/>
</svg>
